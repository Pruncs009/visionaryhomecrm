# Supabase CLI config for LOCAL development (`supabase start`).
# Only the settings this project cares about; the CLI fills in defaults for the rest.
# For the hosted project, set the same values in the Dashboard (see docs/AUTH.md).

project_id = "visionary-home-crm"

[auth]
enabled = true
site_url = "http://localhost:3000"
additional_redirect_urls = [
  "http://localhost:3000/auth/callback",
  "http://localhost:3000/auth/confirm",
]
jwt_expiry = 3600
enable_refresh_token_rotation = true
enable_signup = true
minimum_password_length = 8

[auth.email]
enable_signup = true
enable_confirmations = true      # users must verify their email before signing in
double_confirm_changes = true
secure_password_change = true
max_frequency = "60s"            # one email per address per minute

[auth.email.template.confirmation]
subject = "Confirm your VisionaryHomeCRM account"
content_path = "./supabase/templates/confirmation.html"

[auth.email.template.recovery]
subject = "Reset your VisionaryHomeCRM password"
content_path = "./supabase/templates/recovery.html"
