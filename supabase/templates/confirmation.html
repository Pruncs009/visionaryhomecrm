<!-- Supabase "Confirm signup" template. Variables: {{ .SiteURL }}, {{ .TokenHash }}, {{ .Email }} -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #0f172a;">
  <p style="font-size: 18px; font-weight: 600; color: #1d4ed8; margin: 0 0 24px;">Visionary Home Offer</p>
  <h1 style="font-size: 22px; margin: 0 0 12px;">Confirm your email</h1>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 24px;">
    Thanks for signing up! Click the button below to verify {{ .Email }} and open your CRM.
  </p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=signup&next=/dashboard"
     style="display: inline-block; background: #1d4ed8; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600;">
    Verify email address
  </a>
  <p style="font-size: 13px; color: #64748b; line-height: 1.5; margin: 24px 0 0;">
    This link expires in 24 hours. If you didn't create an account, you can ignore this email.
  </p>
</div>
