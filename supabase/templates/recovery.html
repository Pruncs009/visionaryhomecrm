<!-- Supabase "Reset password" template. Variables: {{ .SiteURL }}, {{ .TokenHash }}, {{ .Email }} -->
<div style="font-family: -apple-system, Segoe UI, Roboto, sans-serif; max-width: 480px; margin: 0 auto; padding: 32px 24px; color: #0f172a;">
  <p style="font-size: 18px; font-weight: 600; color: #1d4ed8; margin: 0 0 24px;">VisionaryHomeCRM</p>
  <h1 style="font-size: 22px; margin: 0 0 12px;">Reset your password</h1>
  <p style="font-size: 15px; line-height: 1.5; margin: 0 0 24px;">
    We received a request to reset the password for {{ .Email }}. Click below to choose a new one.
  </p>
  <a href="{{ .SiteURL }}/auth/confirm?token_hash={{ .TokenHash }}&type=recovery"
     style="display: inline-block; background: #1d4ed8; color: #ffffff; text-decoration: none; padding: 12px 20px; border-radius: 6px; font-weight: 600;">
    Choose a new password
  </a>
  <p style="font-size: 13px; color: #64748b; line-height: 1.5; margin: 24px 0 0;">
    This link expires in 1 hour. If you didn't request a reset, you can ignore this email. Your
    password won't change.
  </p>
</div>
